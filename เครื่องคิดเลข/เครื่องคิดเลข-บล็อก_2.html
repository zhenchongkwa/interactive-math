<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เครื่องคิดเลข</title>
<!-- ต้องอยู่ก่อน <link> ทุกอัน และต้องเป็น inline ไม่ใช่ไฟล์นอก
     ถ้าไปตั้งธีมใน shortcuts.js (ท้าย body) หน้าจะถูกวาดด้วยธีมเข้มก่อนหนึ่งเฟรม
     แล้วค่อยกระพริบเป็นสว่าง ทุกครั้งที่โหลดในโหมดสว่าง -->
<!-- คีย์ 'im-theme' ตัวเดียวกับที่เว็บแม่และกระดานเรขาคณิตใช้ (IM.setTheme ใน
     หน้าเว็บ/assets/js/core.js เป็นคนเขียน) เดิมหน้านี้เก็บแยกไว้ที่ 'calc-theme'
     ผลคือกดปุ่มธีมที่นี่แล้วหน้าอื่นไม่ตาม และกดที่หน้าอื่นแล้วที่นี่ไม่ตาม
     ผู้ใช้เห็นเป็น "ปุ่มธีมไม่ติด" ทั้งที่แต่ละหน้าจำของตัวเองได้ถูกต้อง

     ค่าที่เก็บเป็น 'light'/'dark' เหมือนกันทั้งสองฝั่งอยู่แล้ว จึงอ่านข้ามกันได้ทันที
     ส่วน "ค่าเริ่มต้นเมื่อยังไม่เคยเลือก" ยังเป็นของใครของมันเหมือนเดิมโดยตั้งใจ —
     หน้านี้ตามระบบปฏิบัติการ เว็บแม่เริ่มมืด กระดานเรขาคณิตเริ่มสว่างเพราะกระดาษต้องขาว
     ที่ต้องตรงกันคือ "ตัวเลือกที่ผู้ใช้กดเอง" ไม่ใช่ค่าตั้งต้น -->
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('im-theme'); } catch (e) { /* file:// บางเบราว์เซอร์ห้ามอ่าน */ }
    var dark = saved === null
      ? !window.matchMedia('(prefers-color-scheme: light)').matches
      : saved === 'dark';
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<!-- โหมดอุปกรณ์ — ต้องอยู่ก่อน <link> ด้วยเหตุผลเดียวกับสคริปต์ธีมข้างบน
     ดูคำอธิบายเต็มที่ ../หน้าเว็บ/index.html ข้อความชุดนี้เหมือนกันทุกหน้า -->
<script>(function(){var d=null;try{d=localStorage.getItem('im-device');}catch(e){}if(d!=='mobile'&&d!=='desktop')d=(matchMedia('(pointer:coarse)').matches||innerWidth<=820)?'mobile':'desktop';document.documentElement.dataset.device=d;})();</script>
<!-- ฟอนต์ที่ tokens.css อ้างถึงไม่ได้ถูกโหลดไว้ที่ไหนใน assets/ เลย เว็บเดิมคงลิงก์เอง
     เปิดแบบ file:// ออฟไลน์แล้ว request นี้ล้มเหลวเฉยๆ ไม่พัง เพราะ --sans ใน style.css
     ต่อ system stack เดิมไว้ท้ายสุดแล้ว -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap">
<!-- ลำดับสำคัญ: style.css ต้องมาท้ายสุด ไม่งั้น *{margin:0;padding:0} ของ tokens
     จะล้าง padding ของปุ่มจนคีย์แพดแบน -->
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/motion.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- ทางกลับหน้าเว็บหลัก ปักมุมบนซ้าย — เฟืองของ shortcuts.js จองมุมบนขวาไว้แล้ว
     (position:fixed, z-index 41) วางชนกันจะทับกันพอดี -->
<a class="back-home" href="../หน้าเว็บ/index.html" data-cursor="">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg>
  กลับหน้าหลัก
</a>

<header class="page-head">
  <span class="eyebrow reveal">ALGEBRA CALCULATOR</span>
  <!-- data-split ให้ reveal.js หั่นทีละ "คำ" ด้วย Intl.Segmenter('th')
       หั่นทีละตัวอักษรไม่ได้ สระและวรรณยุกต์จะหลุดจากพยัญชนะ -->
  <h1 data-split>เครื่องคิดเลขบล็อก</h1>
  <p class="lead reveal">ลากพจน์ข้ามเท่ากับ · Ctrl-คลิกเพื่อแก้ · แก้สมการและวาดกราฟให้เอง</p>
</header>

<div class="app">
  <!-- ============================================
       แถบโหมด — โหมดมือถือเท่านั้น (script.js ถอด hidden ออกให้เมื่อ IM.isMobile)
       เครื่องนี้พูดกับผู้ใช้ด้วย Shift กับ Ctrl แทบทั้งหมด ซึ่งนิ้วไม่มีสักปุ่ม
       สามปุ่มนี้จึงตั้งธงเดียวกันที่ปุ่มจริงตั้ง — data-mode ถูกอ่านจาก script.js
       ============================================ -->
  <div class="modes" id="calcModes" hidden>
    <div class="mode-row" role="group" aria-label="โหมดการแตะ">
      <button type="button" data-mode="move" aria-pressed="true">ปกติ</button>
      <button type="button" data-mode="shift" aria-pressed="false">ยกพจน์</button>
      <button type="button" data-mode="ctrl" aria-pressed="false">แก้ค่า</button>
    </div>
    <p class="mode-say" id="calcModeSay"></p>
  </div>

  <div class="display" id="display"></div>

  <div class="grid">
    <button class="span2" onclick="action('(')">(</button>
    <button class="span2" onclick="action(')')">)</button>

    <button onclick="percentLast()">%</button>
    <button onclick="clearEntry()">CE</button>
    <button onclick="clearAll()">C</button>
    <button onclick="backspace()" aria-label="ลบ">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="vertical-align: middle;">
        <path d="M8 4H20C20.5523 4 21 4.44772 21 5V19C21 19.5523 20.5523 20 20 20H8L3 12L8 4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M12.5 9.5L17 14M17 9.5L12.5 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>

    <button onclick="action('1/x')">1/x</button>
    <button onclick="squareLast()">x²</button>
    <button onclick="rootLast()">²√x</button>
    <button onclick="divideLast()">÷</button>

    <button onclick="action('7')">7</button>
    <button onclick="action('8')">8</button>
    <button onclick="action('9')">9</button>
    <button onclick="action('×')">×</button>

    <button onclick="action('4')">4</button>
    <button onclick="action('5')">5</button>
    <button onclick="action('6')">6</button>
    <button onclick="action('−')">−</button>

    <button onclick="action('1')">1</button>
    <button onclick="action('2')">2</button>
    <button onclick="action('3')">3</button>
    <button onclick="action('+')">+</button>

    <button onclick="negateLast()">+/-</button>
    <button onclick="action('0')">0</button>
    <button onclick="action('.')">.</button>
    <button class="equals" onclick="action('=')">=</button>
  </div>

  <!-- ปุ่มนี้แทนที่กริดตัวอักษรที่เคยแสดงตลอดเวลา — shortcuts.js ผูก aria-expanded/hidden
       ให้ตอน boot ถ้า shortcuts.js พังหรือโหลดไม่ทัน ปุ่มนี้จะไม่ทำอะไรเลย แต่ #letters
       ด้านล่างไม่มี hidden ติดมาจาก HTML ตรงๆ จึงยังแสดงกริดตามปกติ ไม่ใช่ปุ่มตายที่ปิดถาวร -->
  <button type="button" class="letters-toggle" id="lettersToggle"
          aria-haspopup="true" aria-expanded="false" aria-controls="letters">ตัวแปร A–Z</button>
  <div class="letters sheet" id="letters" role="dialog" aria-modal="false"
       aria-label="ตัวแปร A ถึง Z" tabindex="-1"></div>
</div>

<div class="graph" id="graph" hidden></div>

<!-- core ต้องมาก่อนเสมอ โมดูลอื่นลงทะเบียนกับ IM.register แล้ว main.js เรียกทีเดียว
     ตอน DOMContentLoaded — จึงรันหลัง script.js เสมอ ไม่ว่าจะวางลำดับไหน
     cursor.js ซ่อนเคอร์เซอร์ระบบทั้งหน้า จุด+วงแหวนจึงอยู่ครบทุกที่ไม่หายไปไหน
     ส่วนความหมายที่ grab/pointer เคยบอก ย้ายไปอยู่ที่สีของวงแหวน — shortcuts.js อ่าน
     สถานะจากคลาสที่ script.js เขียนไว้แล้ว (.picking/.choosing/.block-carry/.block-aimable)
     ไม่โหลด tilt.js — เขียน transform ทุกเฟรม ทำให้ getBoundingClientRect ใน
     script.js วัดตำแหน่งเพี้ยน การลากบล็อกจะไม่ตรง -->
<script src="assets/js/core.js"></script>
<script src="assets/js/field.js"></script>
<script src="assets/js/reveal.js"></script>
<script src="assets/js/cursor.js"></script>
<script src="assets/js/main.js"></script>
<script src="script.js"></script>
<script src="shortcuts.js"></script>
</body>
</html>
